# Enable mouse support
set -g mouse on

# Vi keybindings
set -g mode-keys vi

# Prefix
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

# Windows start at 1
set -g base-index 1
setw -g pane-base-index 1

# Terminal
set-option -ga terminal-overrides ",xterm*:Tc"

# --- Sensible defaults ---
set -g display-time 4000
set -g status-interval 5

bind C-p previous-window
bind C-n next-window

bind R source-file ~/.config/tmux/tmux.conf \; display-message "Reloaded tmux.conf!"

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Split in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind Enter split-window -h -c "#{pane_current_path}"

# Alt-H / Alt-L window navigation
bind -n M-H previous-window
bind -n M-L next-window

# --- Status Bar ---
set -g status on
set -g status-style "fg=white,bg=default"
set -g status-left-length 200
set -g status-right-length 200

setw -g window-status-style "fg=magenta,bg=default"
setw -g window-status-current-style "fg=yellow,bg=default"
setw -g window-status-separator "#[fg=blue]  "

set -g status-left "#[fg=white] #[fg=white]#S  "

set -g status-right "#[fg=white]#(whoami)#[fg=white]@#[fg=white]#H#[fg=brightblack] | #[fg=cyan]%H:%M#[fg=brightblack] | #[fg=brightblack] #[fg=green]#{b:pane_current_path}"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=brightblack"
set -g message-style "fg=brightblack,bg=default"

# Plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# TPM
run '~/.tmux/plugins/tpm/tpm'

# Bind plugin-manager keys explicitly (some managers fail to bind on older tmux).
bind I run-shell "~/.tmux/plugins/tpm/bindings/install_plugins"
bind U run-shell "~/.tmux/plugins/tpm/bindings/update_plugins"
bind M-u run-shell "~/.tmux/plugins/tpm/bindings/clean_plugins"
